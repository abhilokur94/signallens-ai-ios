name: SignalLensAI
options:
  bundleIdPrefix: com.abhisheklokur
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  SignalLensAI:
    type: application
    platform: iOS
    sources:
      - path: SignalLensAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhisheklokur.SignalLensAI
        INFOPLIST_FILE: SignalLensAI/Resources/Info.plist
        PRODUCT_NAME: SignalLens AI
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - SignalLensAITests
  SignalLensAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SignalLensAITests
    dependencies:
      - target: SignalLensAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhisheklokur.SignalLensAITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SignalLensAI:
    build:
      targets:
        SignalLensAI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SignalLensAITests
    archive:
      config: Release
